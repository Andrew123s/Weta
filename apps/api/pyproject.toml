[project]
name = "weta-api"
version = "0.1.0"
description = "Weta FastAPI application (modular monolith entry point)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "weta-core",
    "weta-schemas",
]

[tool.uv.sources]
weta-core = { workspace = true }
weta-schemas = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weta_api"]
