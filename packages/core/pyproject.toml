[project]
name = "weta-core"
version = "0.1.0"
description = "Weta core: Quantity, units, provenance, node contract and canonical hashing. Depends on nothing internal."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pint>=0.24,<0.26",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weta_core"]
